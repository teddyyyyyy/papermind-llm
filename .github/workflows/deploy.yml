name: Deploy

# Runs only after CI passes on main
on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    branches: [main]
    types: [completed]

jobs:
  # ── Deploy backend to Render ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        # Set RENDER_DEPLOY_HOOK_URL in GitHub → Settings → Secrets → Actions
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST --fail \
            && echo "Render deploy triggered" \
            || echo "Render hook not configured yet — skipping"

  # ── Deploy frontend to Vercel ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        working-directory: frontend
        # Set these three secrets in GitHub → Settings → Secrets → Actions:
        #   VERCEL_TOKEN       — from vercel.com/account/tokens
        #   VERCEL_ORG_ID      — from .vercel/project.json after first `vercel link`
        #   VERCEL_PROJECT_ID  — from .vercel/project.json after first `vercel link`
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token "$VERCEL_TOKEN" --yes
